# Serves the built app and forwards /api to the backend container.
# HTTPS is not handled here: put a TLS proxy (Caddy, the host's load balancer...) in front in production.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Receipts up to MAX_UPLOAD_MB (10) plus the rest of the form.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Assistant questions can take a while (several AI calls).
        proxy_read_timeout 300s;
    }

    # Invitation and password-reset tokens are in these paths: keep them out of the access log.
    location /api/invitations/ {
        access_log off;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # "rewrite ... break" serves index.html from this block; try_files would jump to "location /" and log there.
    location ~ ^/(invite|reset-password)/ {
        access_log off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        rewrite ^ /index.html break;
    }

    # Built files have content hashes in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/app/..., /login) all load index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
