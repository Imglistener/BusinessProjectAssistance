<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4B3FD1" />
    <title>Business Project Assistance</title>
    <script>
      // Apply the saved theme before the first paint, so dark mode doesn't flash white.
      try {
        var saved = localStorage.getItem("bpa.theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
        if (localStorage.getItem("bpa.motion") === "reduce") document.documentElement.classList.add("reduce-motion");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
